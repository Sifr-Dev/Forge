name: ci
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        java: ['25', '27']
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress clean verify
      - run: java -jar target/sifr-forge.jar plan examples/exec/forge.json
      - run: java -jar target/sifr-forge.jar run examples/exec/forge.json
      - run: java -jar target/sifr-forge.jar run examples/exec/forge.json | tee "$RUNNER_TEMP/second.log"
      - run: grep CACHE_HIT "$RUNNER_TEMP/second.log"
